<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow Dashboard - 每日與未來待辦事項</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-600 text-white p-2 rounded-xl shadow-md">
                    <i class="fa-solid fa-list-check text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900">Task Flow Dashboard</h1>
                    <p class="text-xs text-slate-500">每日焦點與未來排程管理</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openCategoryModal()" class="inline-flex items-center px-3 py-2 border border-slate-300 text-sm font-medium rounded-lg text-slate-700 bg-white hover:bg-slate-50 transition shadow-sm">
                    <i class="fa-solid fa-tags mr-2 text-brand-600"></i>管理標籤
                </button>
                <button onclick="openTaskModal()" class="inline-flex items-center px-4 py-2 bg-brand-600 border border-transparent rounded-lg font-semibold text-sm text-white hover:bg-brand-700 transition shadow-md">
                    <i class="fa-solid fa-plus mr-2"></i>新增待辦
                </button>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Sidebar / Statistics & Filters -->
        <aside class="lg:col-span-1 space-y-6">
            <!-- Progress Card -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wider mb-3">今日完成進度</h2>
                <div class="flex justify-between text-sm text-slate-600 mb-1">
                    <span id="today-stats-text">已完成 0 / 0</span>
                    <span id="today-stats-percent" class="font-semibold text-brand-600">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                    <div id="today-progress-bar" class="bg-brand-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm space-y-1">
                <button onclick="switchTab('today')" id="tab-btn-today" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm font-medium transition bg-brand-50 text-brand-700">
                    <span class="flex items-center"><i class="fa-solid fa-sun w-5 mr-2"></i>今日焦點</span>
                    <span id="badge-today" class="bg-brand-200 text-brand-800 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
                <button onclick="switchTab('upcoming')" id="tab-btn-upcoming" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-50">
                    <span class="flex items-center"><i class="fa-solid fa-calendar-days w-5 mr-2"></i>未來計畫</span>
                    <span id="badge-upcoming" class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
                <button onclick="switchTab('all')" id="tab-btn-all" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-
