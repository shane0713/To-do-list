<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow Dashboard - 每日與未來待辦事項</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            500: '#334155',
                            600: '#0f172a',
                            700: '#020617',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-slate-900 text-white p-2 rounded-xl shadow-md">
                    <i class="fa-solid fa-list-check text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900">Task Flow Dashboard</h1>
                    <p class="text-xs text-slate-500">每日焦點與未來排程管理</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openCategoryModal()" class="inline-flex items-center px-3 py-2 border border-slate-300 text-sm font-medium rounded-lg text-slate-700 bg-white hover:bg-slate-50 transition shadow-sm">
                    <i class="fa-solid fa-tags mr-2 text-slate-900"></i>管理標籤
                </button>
                <button onclick="openTaskModal()" class="inline-flex items-center px-4 py-2 bg-slate-900 border border-transparent rounded-lg font-semibold text-sm text-white hover:bg-slate-800 transition shadow-md">
                    <i class="fa-solid fa-plus mr-2"></i>新增待辦
                </button>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Sidebar / Statistics & Filters -->
        <aside class="lg:col-span-1 space-y-6">
            <!-- Progress Card -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wider mb-3">今日完成進度</h2>
                <div class="flex justify-between text-sm text-slate-600 mb-1">
                    <span id="today-stats-text">已完成 0 / 0</span>
                    <span id="today-stats-percent" class="font-semibold text-slate-900">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                    <div id="today-progress-bar" class="bg-slate-900 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm space-y-1">
                <button onclick="switchTab('today')" id="tab-btn-today" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm font-medium transition bg-slate-900 text-white">
                    <span class="flex items-center"><i class="fa-solid fa-sun w-5 mr-2"></i>今日焦點</span>
                    <span id="badge-today" class="bg-slate-700 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
                <button onclick="switchTab('upcoming')" id="tab-btn-upcoming" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-50">
                    <span class="flex items-center"><i class="fa-solid fa-calendar-days w-5 mr-2"></i>未來計畫</span>
                    <span id="badge-upcoming" class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
                <button onclick="switchTab('all')" id="tab-btn-all" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-50">
                    <span class="flex items-center"><i class="fa-solid fa-layer-group w-5 mr-2"></i>全部總覽</span>
                    <span id="badge-all" class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
                <button onclick="switchTab('completed')" id="tab-btn-completed" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-50">
                    <span class="flex items-center"><i class="fa-solid fa-circle-check w-5 mr-2"></i>已完成紀錄</span>
                    <span id="badge-completed" class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
            </div>

            <!-- Data Backup Controls -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">資料管理與備份</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="exportData()" class="w-full px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg transition flex items-center justify-center">
                        <i class="fa-solid fa-download mr-1.5"></i>匯出備份
                    </button>
                    <label class="w-full px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg transition flex items-center justify-center cursor-pointer">
                        <i class="fa-solid fa-upload mr-1.5"></i>匯入還原
                        <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
                    </label>
                </div>
            </div>
        </aside>

        <!-- Content Area -->
        <section class="lg:col-span-3 space-y-4">
            <!-- Search & Filters Bar -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <div class="flex flex-col sm:flex-row gap-2">
                    <div class="relative flex-1">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input type="text" id="search-input" oninput="renderTasks()" placeholder="搜尋待辦事項..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 focus:bg-white transition">
                    </div>
                    <!-- 排序選單 -->
                    <div class="w-full sm:w-44">
                        <select id="sort-by" onchange="renderTasks()" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-900">
                            <option value="time">依時間排序</option>
                            <option value="priority">依優先程度排序</option>
                        </select>
                    </div>
                </div>
                <!-- 篩選器：分類 1、分類 2、優先程度同一列 -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-1 border-t border-slate-100">
                    <div>
                        <select id="filter-category1" onchange="renderTasks()" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-900">
                            <option value="all">全部 - 分類 1</option>
                        </select>
                    </div>
                    <div>
                        <select id="filter-category2" onchange="renderTasks()" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-900">
                            <option value="all">全部 - 分類 2</option>
                        </select>
                    </div>
                    <div>
                        <select id="filter-priority" onchange="renderTasks()" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-900">
                            <option value="all">全部優先程度</option>
                            <option value="high">高程度</option>
                            <option value="medium">中程度</option>
                            <option value="low">低程度</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Task List Container -->
            <div id="task-list" class="space-y-3">
                <!-- JavaScript 動態渲染項目 -->
            </div>
        </section>
    </main>

    <!-- Task Modal (新增/編輯) -->
    <div id="task-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4 border border-slate-100">
            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900">新增待辦事項</h3>
                <button onclick="closeTaskModal()" class="text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="task-form" onsubmit="handleTaskSubmit(event)" class="space-y-4">
                <input type="hidden" id="task-id">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">任務標題 *</label>
                    <input type="text" id="task-title" required placeholder="例如：每週週報彙整" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
                </div>

                <!-- 重複週期移至上方 -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">重複週期</label>
                    <select id="task-recurring" onchange="toggleRecurringMode()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
                        <option value="none">不重複</option>
                        <option value="daily">每天重複</option>
                        <option value="weekly">每週重複</option>
                        <option value="monthly">每月重複</option>
                    </select>
                </div>

                <!-- 依重複週期動態切換：非重複顯示一般預計日期時間；有重複顯示開始與結束 -->
                <div id="date-time-container" class="space-y-3">
                    <!-- 動態填入 -->
                </div>

                <!-- 優先程度 -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">優先程度</label>
                    <select id="task-priority" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
                        <option value="low">低程度</option>
                        <option value="medium" selected>中程度</option>
                        <option value="high">高程度</option>
                    </select>
                </div>

                <!-- 分類標籤 1 與 分類標籤 2 -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">分類標籤 1</label>
                        <select id="task-category1" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
                            <!-- 動態填充 -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">分類標籤 2</label>
                        <select id="task-category2" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
                            <option value="">(無)</option>
                            <!-- 動態填充 -->
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">備註說明</label>
                    <textarea id="task-notes" rows="3" placeholder="補充細節或相關連結..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900"></textarea>
                </div>

                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeTaskModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-xl transition">取消</button>
                    <button type="submit" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold rounded-xl transition shadow-md">儲存任務</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Category Management Modal (標籤管理視窗) -->
    <div id="category-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4 border border-slate-100">
            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-900">管理分類標籤</h3>
                <button onclick="closeCategoryModal()" class="text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <!-- 分類標籤 1 / 分類標籤 2 切換分頁 -->
            <div class="flex bg-slate-100 p-1 rounded-xl">
                <button onclick="switchCategoryManageTab(1)" id="cat-tab-btn-1" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition bg-white text-slate-900 shadow-sm">
                    分類標籤 1
                </button>
                <button onclick="switchCategoryManageTab(2)" id="cat-tab-btn-2" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition text-slate-500 hover:text-slate-800">
                    分類標籤 2
                </button>
            </div>

            <!-- 新增標籤表單 -->
            <form onsubmit="handleCategoryAdd(event)" class="flex gap-2 items-end bg-slate-50 p-3 rounded-xl border border-slate-200">
                <div class="flex-1">
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1" id="new-cat-label">新增至 分類標籤 1</label>
                    <input type="text" id="new-cat-name" required placeholder="例如：專案A、行政" class="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">顏色調性</label>
                    <select id="new-cat-color" class="px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
                        <option value="bg-slate-900 text-white">深黑</option>
                        <option value="bg-slate-700 text-white" selected>石墨灰</option>
                        <option value="bg-slate-200 text-slate-800">淺灰</option>
                        <option value="bg-slate-100 text-slate-700 border border-slate-300">極簡白</option>
                    </select>
                </div>
                <button type="submit" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold rounded-lg transition shadow-sm">新增</button>
            </form>

            <!-- 現有標籤列表（可編輯名稱與顏色、刪除） -->
            <div class="space-y-2 max-h-60 overflow-y-auto pr-1" id="category-list-container">
                <!-- 動態填充 -->
            </div>

            <div class="flex justify-end pt-2">
                <button type="button" onclick="closeCategoryModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-xl transition">關閉</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        function getTodayDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getCurrentHourString() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            return `${hours}:00`;
        }

        let categories1 = JSON.parse(localStorage.getItem('taskflow_categories1')) || JSON.parse(localStorage.getItem('taskflow_categories')) || [
            { id: 'work', name: '工作', color: 'bg-slate-900 text-white' },
            { id: 'personal', name: '個人', color: 'bg-slate-700 text-white' },
            { id: 'study', name: '學習', color: 'bg-slate-200 text-slate-800' }
        ];

        let categories2 = JSON.parse(localStorage.getItem('taskflow_categories2')) || [
            { id: 'project_a', name: '重點專案', color: 'bg-slate-900 text-white' },
            { id: 'routine', name: '日常例行', color: 'bg-slate-700 text-white' },
            { id: 'shopping', name: '採購備忘', color: 'bg-slate-100 text-slate-700 border border-slate-300' }
        ];

        let tasks = JSON.parse(localStorage.getItem('taskflow_tasks')) || [
            { id: '1', title: '完成專案報告草稿', date: getTodayDateString(), time: '17:00', priority: 'high', category1: 'work', category2: 'project_a', recurring: 'none', startDate: '', startTime: '', endDate: '', endTime: '', notes: '確認數據與圖表細節', completed: false },
            { id: '2', title: '每週部門進度會議記錄', date: getTodayDateString(), time: '10:00', priority: 'medium', category1: 'work', category2: 'routine', recurring: 'weekly', startDate: getTodayDateString(), startTime: '10:00', endDate: '2026-12-31', endTime: '10:00', notes: '記得整理 Action Items', completed: false }
        ];

        let currentTab = 'today';
        let currentManageCatGroup = 1;

        document.addEventListener('DOMContentLoaded', () => {
            updateCategoryDropdowns();
            renderTasks();
            toggleRecurringMode();
        });

        function saveData() {
            localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
            localStorage.setItem('taskflow_categories1', JSON.stringify(categories1));
            localStorage.setItem('taskflow_categories2', JSON.stringify(categories2));
            updateCategoryDropdowns();
            renderTasks();
        }

        function switchTab(tab) {
            currentTab = tab;
            ['today', 'upcoming', 'all', 'completed'].forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === tab) {
                    btn.className = "w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm font-medium transition bg-slate-900 text-white";
                    document.getElementById(`badge-${t}`).className = "bg-slate-700 text-white text-xs px-2 py-0.5 rounded-full font-bold";
                } else {
                    btn.className = "w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-50";
                    document.getElementById(`badge-${t}`).className = "bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded-full font-bold";
                }
            });
            renderTasks();
        }

        function updateCategoryDropdowns() {
            const filterCat1 = document.getElementById('filter-category1');
            const filterCat2 = document.getElementById('filter-category2');
            const cat1 = document.getElementById('task-category1');
            const cat2 = document.getElementById('task-category2');
            
            const currentFilter1Val = filterCat1.value;
            const currentFilter2Val = filterCat2.value;
            const currentCat1Val = cat1.value;
            const currentCat2Val = cat2.value;

            filterCat1.innerHTML = '<option value="all">全部 - 分類 1</option>' + categories1.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            filterCat1.value = currentFilter1Val;

            filterCat2.innerHTML = '<option value="all">全部 - 分類 2</option>' + categories2.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            filterCat2.value = currentFilter2Val;

            cat1.innerHTML = categories1.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            if (categories1.some(c => c.id === currentCat1Val)) {
                cat1.value = currentCat1Val;
            }

            cat2.innerHTML = '<option value="">(無)</option>' + categories2.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            if (currentCat2Val === '' || categories2.some(c => c.id === currentCat2Val)) {
                cat2.value = currentCat2Val;
            }
        }

        const hourOptionsHtml = `
            <option value="00:00">00 時</option><option value="01:00">01 時</option><option value="02:00">02 時</option>
            <option value="03:00">03 時</option><option value="04:00">04 時</option><option value="05:00">05 時</option>
            <option value="06:00">06 時</option><option value="07:00">07 時</option><option value="08:00">08 時</option>
            <option value="09:00">09 時</option><option value="10:00" selected>10 時</option><option value="11:00">11 時</option>
            <option value="12:00">12 時</option><option value="13:00">13 時</option><option value="14:00">14 時</option>
            <option value="15:00">15 時</option><option value="16:00">16 時</option><option value="17:00">17 時</option>
            <option value="18:00">18 時</option><option value="19:00">19 時</option><option value="20:00">20 時</option>
            <option value="21:00">21 時</option><option value="22:00">22 時</option><option value="23:00">23 時</option>
        `;

        function toggleRecurringMode() {
            const recurringVal = document.getElementById('task-recurring').value;
            const container = document.getElementById('date-time-container');

            if (recurringVal === 'none') {
                container.innerHTML = `
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">預計到期日 *</label>
                            <input type="date" id="task-date" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">預計時間 (24時制) *</label>
                            <select id="task-hour" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
                                ${hourOptionsHtml}
                            </select>
                        </div>
                    </div>
                `;
                document.getElementById('task-date').value = getTodayDateString();
            } else {
                container.innerHTML = `
                    <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-3">
                        <div class="text-xs font-bold text-slate-900 flex items-center"><i class="fa-solid fa-calendar-days mr-1.5"></i>重複週期區間設定</div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">開始日期 *</label>
                                <input type="date" id="task-start-date" required class="w-full px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-slate-900">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">開始時間 *</label>
                                <select id="task-start-hour" required class="w-full px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-slate-900">
                                    ${hourOptionsHtml}
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">結束日期 (截止) *</label>
                                <input type="date" id="task-end-date" required class="w-full px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-slate-900">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">結束時間 *</label>
                                <select id="task-end-hour" required class="w-full px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-slate-900">
                                    ${hourOptionsHtml}
                                </select>
                            </div>
                        </div>
                    </div>
                `;
                const today = getTodayDateString();
                document.getElementById('task-start-date').value = today;
                document.getElementById('task-end-date').value = today;
            }
        }

        function renderTasks() {
            const listEl = document.getElementById('task-list');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const sortBy = document.getElementById('sort-by').value;
            const cat1Filter = document.getElementById('filter-category1').value;
            const cat2Filter = document.getElementById('filter-category2').value;
            const prioFilter = document.getElementById('filter-priority').value;

            const todayStr = getTodayDateString();

            const todayCount = tasks.filter(t => !t.completed && (t.date === todayStr || (t.recurring !== 'none' && t.startDate <= todayStr && t.endDate >= todayStr))).length;
            const upcomingCount = tasks.filter(t => !t.completed && (t.date > todayStr || (t.recurring !== 'none' && t.startDate > todayStr))).length;
            const allCount = tasks.filter(t => !t.completed).length;
            const completedCount = tasks.filter(t => t.completed).length;

            document.getElementById('badge-today').innerText = todayCount;
            document.getElementById('badge-upcoming').innerText = upcomingCount;
            document.getElementById('badge-all').innerText = allCount;
            document.getElementById('badge-completed').innerText = completedCount;

            const todayTasks = tasks.filter(t => t.date === todayStr || (t.recurring !== 'none' && t.startDate <= todayStr && t.endDate >= todayStr));
            const todayDone = todayTasks.filter(t => t.completed).length;
            const todayTotal = todayTasks.length;
            const percent = todayTotal > 0 ? Math.round((todayDone / todayTotal) * 100) : 0;
            document.getElementById('today-stats-text').innerText = `已完成 ${todayDone} / ${todayTotal}`;
            document.getElementById('today-stats-percent').innerText = `${percent}%`;
            document.getElementById('today-progress-bar').style.width = `${percent}%`;

            let filtered = tasks.filter(t => {
                const tDate = t.recurring !== 'none' ? t.startDate : (t.date || todayStr);
                const c1 = t.category1 || t.category || '';
                const c2 = t.category2 || '';

                if (currentTab === 'today' && (t.completed || (t.recurring === 'none' && tDate !== todayStr) || (t.recurring !== 'none' && (t.startDate > todayStr || t.endDate < todayStr)))) return false;
                if (currentTab === 'upcoming' && (t.completed || tDate <= todayStr)) return false;
                if (currentTab === 'all' && t.completed) return false;
                if (currentTab === 'completed' && !t.completed) return false;

                if (searchVal && !t.title.toLowerCase().includes(searchVal) && (!t.notes || !t.notes.toLowerCase().includes(searchVal))) return false;
                
                if (cat1Filter !== 'all' && c1 !== cat1Filter) return false;
                if (cat2Filter !== 'all' && c2 !== cat2Filter) return false;
                if (prioFilter !== 'all' && t.priority !== prioFilter) return false;

                return true;
            });

            filtered.sort((a, b) => {
                const dateA = a.recurring !== 'none' ? a.startDate : (a.date || '');
                const dateB = b.recurring !== 'none' ? b.startDate : (b.date || '');
                const timeA = a.recurring !== 'none' ? a.startTime : (a.time || '00:00');
                const timeB = b.recurring !== 'none' ? b.startTime : (b.time || '00:00');

                if (sortBy === 'priority') {
                    const weights = { high: 3, medium: 2, low: 1 };
                    const pDiff = weights[b.priority] - weights[a.priority];
                    if (pDiff !== 0) return pDiff;
                    return (dateA + ' ' + timeA).localeCompare(dateB + ' ' + timeB);
                } else {
                    const dtA = dateA + ' ' + timeA;
                    const dtB = dateB + ' ' + timeB;
                    if (dtA !== dtB) return dtA.localeCompare(dtB);
                    const weights = { high: 3, medium: 2, low: 1 };
                    return weights[b.priority] - weights[a.priority];
                }
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="bg-white p-12 rounded-2xl border border-slate-200 text-center space-y-3">
                        <div class="text-slate-300 text-4xl"><i class="fa-solid fa-clipboard-check"></i></div>
                        <p class="text-slate-500 text-sm">目前沒有找到相關的待辦事項</p>
                    </div>
                `;
                return;
            }

            const currentFullStr = getTodayDateString() + ' ' + getCurrentHourString();

            listEl.innerHTML = filtered.map(t => {
                const c1Id = t.category1 || t.category || '';
                const c2Id = t.category2 || '';

                const catObj1 = categories1.find(c => c.id === c1Id) || { name: '未分類', color: 'bg-slate-100 text-slate-800' };
                const catObj2 = categories2.find(c => c.id === c2Id);

                const prioBadge = {
                    high: '<span class="px-2 py-0.5 bg-slate-900 text-white text-xs rounded-md font-medium">高程度</span>',
                    medium: '<span class="px-2 py-0.5 bg-slate-200 text-slate-800 text-xs rounded-md font-medium">中程度</span>',
                    low: '<span class="px-2 py-0.5 bg-slate-100 text-slate-500 text-xs rounded-md font-medium border border-slate-200">低程度</span>'
                }[t.priority];

                let recurringText = '';
                let dtDisplay = '';
                let isOverdue = false;

                if (t.recurring && t.recurring !== 'none') {
                    const typeMap = { daily: '每天', weekly: '每週', monthly: '每月' }[t.recurring];
                    recurringText = `<span class="px-2 py-0.5 bg-slate-100 text-slate-600 text-xs rounded-md font-medium border border-slate-200"><i class="fa-solid fa-rotate-right mr-1"></i>${typeMap}重複</span>`;
                    const sTime = t.startTime ? t.startTime.substring(0, 2) + ' 時' : '00 時';
                    const eTime = t.endTime ? t.endTime.substring(0, 2) + ' 時' : '00 時';
                    dtDisplay = `開始：${t.startDate} ${sTime} ｜ 結束：${t.endDate} ${eTime}`;
                    isOverdue = !t.completed && (`${t.endDate} ${t.endTime || '00:00'}` < currentFullStr);
                } else {
                    const timeDisplay = t.time ? t.time.substring(0, 2) + ' 時' : '00 時';
                    dtDisplay = `預計到期：${t.date || todayStr} ${timeDisplay}`;
                    isOverdue = !t.completed && (`${t.date || todayStr} ${t.time || '00:00'}` < currentFullStr);
                }

                return `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-start justify-between gap-4 hover:border-slate-400 transition">
                        <div class="flex items-start space-x-3 flex-1">
                            <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="toggleTask('${t.id}')" class="mt-1 h-4 w-4 text-slate-900 focus:ring-slate-900 border-slate-300 rounded cursor-pointer">
                            <div class="space-y-1 flex-1">
                                <div class="flex items-center flex-wrap gap-2">
                                    <h3 class="text-sm font-bold text-slate-900 ${t.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(t.title)}</h3>
                                    <span class="px-2 py-0.5 text-xs rounded-md font-medium ${catObj1.color}">${catObj1.name}</span>
                                    ${catObj2 ? `<span class="px-2 py-0.5 text-xs rounded-md font-medium ${catObj2.color}">${catObj2.name}</span>` : ''}
                                    ${prioBadge}
                                    ${recurringText}
                                </div>
                                ${t.notes ? `<p class="text-xs text-slate-500">${escapeHtml(t.notes)}</p>` : ''}
                                <div class="flex items-center text-xs text-slate-400 space-x-3 pt-1">
                                    <span class="flex items-center ${isOverdue ? 'text-slate-900 font-bold underline' : ''}">
                                        <i class="fa-regular fa-clock mr-1"></i>${dtDisplay} ${isOverdue ? '(已逾期)' : ''}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1">
                            <button onclick="openTaskModal('${t.id}')" class="p-2 text-slate-400 hover:text-slate-800 rounded-lg hover:bg-slate-50 transition" title="編輯">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="deleteTask('${t.id}')" class="p-2 text-slate-400 hover:text-slate-900 rounded-lg hover:bg-slate-50 transition" title="刪除">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function calculateNextDateAndTime(dateStr, timeStr, recurringType) {
            const dt = new Date(`${dateStr}T${timeStr || '00:00'}`);
            if (isNaN(dt.getTime())) return { date: dateStr, time: timeStr };

            if (recurringType === 'daily') {
                dt.setDate(dt.getDate() + 1);
            } else if (recurringType === 'weekly') {
                dt.setDate(dt.getDate() + 7);
            } else if (recurringType === 'monthly') {
                dt.setMonth(dt.getMonth() + 1);
            }

            const year = dt.getFullYear();
            const month = String(dt.getMonth() + 1).padStart(2, '0');
            const day = String(dt.getDate()).padStart(2, '0');
            const hours = String(dt.getHours()).padStart(2, '0');
            return {
                date: `${year}-${month}-${day}`,
                time: `${hours}:00`
            };
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                const wasCompleted = task.completed;
                task.completed = !wasCompleted;

                if (!wasCompleted && task.recurring && task.recurring !== 'none') {
                    const next = calculateNextDateAndTime(task.startDate || getTodayDateString(), task.startTime || '10:00', task.recurring);
                    let shouldRepeat = true;
                    if (task.endDate && next.date > task.endDate) {
                        shouldRepeat = false;
                    }

                    if (shouldRepeat) {
                        const nextTask = {
                            id: Date.now().toString(),
                            title: task.title,
                            date: '',
                            time: '',
                            recurring: task.recurring,
                            startDate: next.date,
                            startTime: next.time,
                            endDate: task.endDate,
                            endTime: task.endTime,
                            priority: task.priority,
                            category1: task.category1 || task.category || '',
                            category2: task.category2 || '',
                            notes: task.notes || '',
                            completed: false
                        };
                        tasks.push(nextTask);
                    }
                }
                saveData();
            }
        }

        function deleteTask(id) {
            if (confirm('確定要刪除這個待辦事項嗎？')) {
                tasks = tasks.filter(t => t.id !== id);
                saveData();
            }
        }

        function openTaskModal(id = null) {
            const modal = document.getElementById('task-modal');
            const titleEl = document.getElementById('modal-title');
            document.getElementById('task-form').reset();
            document.getElementById('task-recurring').value = 'none';
            toggleRecurringMode();

            if (id) {
                titleEl.innerText = '編輯待辦事項';
                const task = tasks.find(t => t.id === id);
                if (task) {
                    document.getElementById('task-id').value = task.id;
                    document.getElementById('task-title').value = task.title;
                    document.getElementById('task-recurring').value = task.recurring || 'none';
                    toggleRecurringMode();

                    if (task.recurring && task.recurring !== 'none') {
                        document.getElementById('task-start-date').value = task.startDate || getTodayDateString();
                        document.getElementById('task-start-hour').value = task.startTime || '10:00';
                        document.getElementById('task-end-date').value = task.endDate || getTodayDateString();
                        document.getElementById('task-end-hour').value = task.endTime || '10:00';
                    } else {
                        document.getElementById('task-date').value = task.date || getTodayDateString();
                        document.getElementById('task-hour').value = task.time ? task.time.substring(0, 2) + ':00' : '10:00';
                    }

                    document.getElementById('task-priority').value = task.priority;
                    document.getElementById('task-category1').value = task.category1 || task.category || (categories1[0] ? categories1[0].id : '');
                    document.getElementById('task-category2').value = task.category2 || '';
                    document.getElementById('task-notes').value = task.notes || '';
                }
            } else {
                titleEl.innerText = '新增待辦事項';
                document.getElementById('task-id').value = '';
                if (categories1.length > 0) {
                    document.getElementById('task-category1').value = categories1[0].id;
                }
            }
            modal.classList.remove('hidden');
        }

        function closeTaskModal() {
            document.getElementById('task-modal').classList.add('hidden');
        }

        function handleTaskSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('task-id').value;
            const title = document.getElementById('task-title').value;
            const recurring = document.getElementById('task-recurring').value;
            const priority = document.getElementById('task-priority').value;
            const category1 = document.getElementById('task-category1').value;
            const category2 = document.getElementById('task-category2').value;
            const notes = document.getElementById('task-notes').value;

            let date = '';
            let time = '';
            let startDate = '';
            let startTime = '';
            let endDate = '';
            let endTime = '';

            if (recurring === 'none') {
                date = document.getElementById('task-date').value;
                time = document.getElementById('task-hour').value;
            } else {
                startDate = document.getElementById('task-start-date').value;
                startTime = document.getElementById('task-start-hour').value;
                endDate = document.getElementById('task-end-date').value;
                endTime = document.getElementById('task-end-hour').value;
            }

            if (id) {
                const task = tasks.find(t => t.id === id);
                if (task) {
                    task.title = title;
                    task.date = date;
                    task.time = time;
                    task.recurring = recurring;
                    task.startDate = startDate;
                    task.startTime = startTime;
                    task.endDate = endDate;
                    task.endTime = endTime;
                    task.priority = priority;
                    task.category1 = category1;
                    task.category2 = category2;
                    task.notes = notes;
                }
            } else {
                const newTask = {
                    id: Date.now().toString(),
                    title,
                    date,
                    time,
                    recurring,
                    startDate,
                    startTime,
                    endDate,
                    endTime,
                    priority,
                    category1,
                    category2,
                    notes,
                    completed: false
                };
                tasks.push(newTask);
            }

            saveData();
            closeTaskModal();
        }

        function switchCategoryManageTab(groupNum) {
            currentManageCatGroup = groupNum;
            const btn1 = document.getElementById('cat-tab-btn-1');
            const btn2 = document.getElementById('cat-tab-btn-2');
            const labelEl = document.getElementById('new-cat-label');

            if (groupNum === 1) {
                btn1.className = "flex-1 py-1.5 text-xs font-bold rounded-lg transition bg-white text-slate-900 shadow-sm";
                btn2.className = "flex-1 py-1.5 text-xs font-bold rounded-lg transition text-slate-500 hover:text-slate-800";
                labelEl.innerText = "新增至 分類標籤 1";
            } else {
                btn2.className = "flex-1 py-1.5 text-xs font-bold rounded-lg transition bg-white text-slate-900 shadow-sm";
                btn1.className = "flex-1 py-1.5 text-xs font-bold rounded-lg transition text-slate-500 hover:text-slate-800";
                labelEl.innerText = "新增至 分類標籤 2";
            }
            renderCategoryList();
        }

        function openCategoryModal() {
            switchCategoryManageTab(1);
            document.getElementById('category-modal').classList.remove('hidden');
        }

        function closeCategoryModal() {
            document.getElementById('category-modal').classList.add('hidden');
        }

        function renderCategoryList() {
            const container = document.getElementById('category-list-container');
            const list = currentManageCatGroup === 1 ? categories1 : categories2;

            if (list.length === 0) {
                container.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">目前尚無標籤，請於上方新增</div>`;
                return;
            }

            container.innerHTML = list.map(c => `
                <div class="flex items-center justify-between p-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                    <div class="flex items-center space-x-2">
                        <span class="px-2.5 py-1 text-xs rounded-md font-medium ${c.color}">${c.name}</span>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <select onchange="updateCategoryColor('${c.id}', this.value)" class="text-xs bg-white border border-slate-200 rounded-lg px-2 py-1 focus:outline-none">
                            <option value="bg-slate-900 text-white" ${c.color.includes('slate-900') ? 'selected' : ''}>深黑</option>
                            <option value="bg-slate-700 text-white" ${c.color.includes('slate-700') ? 'selected' : ''}>石墨灰</option>
                            <option value="bg-slate-200 text-slate-800" ${c.color.includes('slate-200') ? 'selected' : ''}>淺灰</option>
                            <option value="bg-slate-100 text-slate-700 border border-slate-300" ${c.color.includes('border') ? 'selected' : ''}>極簡白</option>
                        </select>
                        <button onclick="editCategory('${c.id}')" class="text-slate-400 hover:text-slate-800 p-1 transition" title="編輯名稱">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        ${(currentManageCatGroup === 1 && categories1.length <= 1) ? `
                            <span class="text-xs text-slate-400 ml-1">至少保留一個</span>
                        ` : `
                            <button onclick="deleteCategory('${c.id}')" class="text-slate-400 hover:text-slate-900 p-1 transition" title="刪除標籤">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        `}
                    </div>
                </div>
            `).join('');
        }

        function handleCategoryAdd(e) {
            e.preventDefault();
            const name = document.getElementById('new-cat-name').value.trim();
            const color = document.getElementById('new-cat-color').value;
            const id = 'cat_' + Date.now();

            if (name) {
                if (currentManageCatGroup === 1) {
                    categories1.push({ id, name, color });
                } else {
                    categories2.push({ id, name, color });
                }
                document.getElementById('new-cat-name').value = '';
                saveData();
                renderCategoryList();
            }
        }

        function editCategory(id) {
            const list = currentManageCatGroup === 1 ? categories1 : categories2;
            const cat = list.find(c => c.id === id);
            if (!cat) return;

            const newName = prompt('請輸入新的標籤名稱：', cat.name);
            if (newName !== null) {
                const trimmed = newName.trim();
                if (trimmed) {
                    cat.name = trimmed;
                    saveData();
                    renderCategoryList();
                } else {
                    alert('標籤名稱不得為空白！');
                }
            }
        }

        function updateCategoryColor(id, newColor) {
            const list = currentManageCatGroup === 1 ? categories1 : categories2;
            const cat = list.find(c => c.id === id);
            if (cat) {
                cat.color = newColor;
                saveData();
                renderCategoryList();
            }
        }

        function deleteCategory(id) {
            if (currentManageCatGroup === 1) {
                if (categories1.length <= 1) {
                    alert('分類標籤 1 至少必須保留一個標籤！');
                    return;
                }
                if (confirm('刪除標籤後，原本屬於此標籤 1 的待辦事項將轉為預設標籤。確定刪除嗎？')) {
                    categories1 = categories1.filter(c => c.id !== id);
                    const fallbackCat = categories1[0].id;
                    tasks.forEach(t => {
                        if (t.category1 === id || t.category === id) {
                            t.category1 = fallbackCat;
                        }
                    });
                    saveData();
                    renderCategoryList();
                }
            } else {
                if (confirm('刪除標籤後，原標籤 2 將自動清空。確定刪除嗎？')) {
                    categories2 = categories2.filter(c => c.id !== id);
                    tasks.forEach(t => {
                        if (t.category2 === id) t.category2 = '';
                    });
                    saveData();
                    renderCategoryList();
                }
            }
        }

        function exportData() {
            const data = { tasks, categories1, categories2 };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `taskflow_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.tasks) {
                        tasks = data.tasks;
                        if (data.categories1) categories1 = data.categories1;
                        if (data.categories2) categories2 = data.categories2;
                        saveData();
                        alert('資料匯入還原成功！');
                    } else {
                        alert('備份檔案格式不正確！');
                    }
                } catch (err) {
                    alert('解析備份檔案失敗！');
                }
            };
            reader.readAsText(file);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
